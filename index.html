<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adivina el programa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: cartel electoral con la bandera como franja (rojo 1 : gualda 2 : rojo 1); una papeleta con borde perforado en el centro; resultado como hemiciclo. */
:root{
  --rojo:#aa151b; --gualda:#f1bf00; --on-gualda:#1b1410; --on-rojo:#fff6e0;
  --bg:#f3ede0; --paper:#fffdf6; --ink:#1b1410; --muted:#6a5a4e; --line:#d9cdb8;
  --ok:#1f7a45; --ok-bg:#e0f2e6; --bad:#aa151b; --bad-bg:#f9e1e0; --shadow:rgba(27,20,16,.18);
  --display:"Alfa Slab One",Georgia,"Times New Roman",serif;
  --label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --rojo:#d6353c; --bg:#150c0d; --paper:#231516; --ink:#f6ece0; --muted:#b9a79a; --line:#3d2b2c;
  --ok:#5fd18d; --ok-bg:#12331f; --bad:#ff7d84; --bad-bg:#3b1a1c; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --rojo:#d6353c; --bg:#150c0d; --paper:#231516; --ink:#f6ece0; --muted:#b9a79a; --line:#3d2b2c;
  --ok:#5fd18d; --ok-bg:#12331f; --bad:#ff7d84; --bad-bg:#3b1a1c; --shadow:rgba(0,0,0,.5); color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding:0}
.flag{height:14px;background:linear-gradient(var(--rojo) 0 25%,var(--gualda) 25% 75%,var(--rojo) 75%)}
.page{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:14px;display:flex;align-items:center;gap:10px}
.brand i{width:22px;height:16px;background:linear-gradient(var(--rojo) 0 25%,var(--gualda) 25% 75%,var(--rojo) 75%);border:1px solid var(--ink)}
.stats{display:flex;gap:16px;font-family:var(--label);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums;color:var(--muted)}
.stats b{color:var(--ink);font-size:20px}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{flex:1 1 0;min-width:8px;height:10px;background:var(--line)}
.pips i.ok{background:var(--ok)} .pips i.no{background:var(--rojo)} .pips i.cur{background:var(--gualda);outline:2px solid var(--ink)}
.card{background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--shadow);position:relative;min-width:0}
.card.ballot{padding:30px 20px 22px;display:flex;flex-direction:column;gap:18px}
.card.ballot::before{content:"";position:absolute;left:0;right:0;top:9px;border-top:2px dashed var(--line)}
.tag{display:flex;align-items:center;gap:10px;font-family:var(--label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--rojo)}
.tag span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-family:var(--body);font-weight:600;font-size:clamp(20px,4.9vw,26px);line-height:1.3;letter-spacing:-.005em;margin:0;text-wrap:balance}
.q small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.opts{grid-template-columns:1fr}}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border:2px solid var(--line);background:var(--paper);min-width:0;
  font-family:var(--label);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase;transition:transform .12s,border-color .12s}
.opt:hover:not([aria-disabled="true"]){border-color:var(--ink);transform:translateY(-2px)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--rojo);outline-offset:2px}
.badge{flex:none;width:40px;height:40px}
.badge svg{width:100%;height:100%;display:block}
.badge .sh{fill:var(--ink)} .badge text{fill:var(--gualda);font:700 15px var(--label)}
.opt kbd{margin-left:auto;font:600 12px var(--body);color:var(--muted);border:1px solid var(--line);padding:0 6px}
.opt[aria-disabled="true"]{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.45}
.stamp{position:absolute;right:14px;bottom:22px;font-family:var(--display);font-size:22px;letter-spacing:.06em;padding:2px 12px;border:4px solid;transform:rotate(-9deg);
  pointer-events:none;opacity:.92;animation:st .28s cubic-bezier(.2,1.6,.4,1)}
.stamp.ok{color:var(--ok)} .stamp.no{color:var(--bad)}
@keyframes st{from{transform:rotate(-9deg) scale(2);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.92}}
.fb{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.fb p{margin:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--gualda);color:var(--on-gualda);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:19px;padding:10px 24px;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
/* inicio */
.hero{overflow:hidden}
.hero .band{background:var(--rojo);color:var(--on-rojo);padding:26px 22px 22px;display:flex;gap:16px;align-items:center;border-bottom:2px solid var(--ink)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,56px);line-height:1;margin:0;text-wrap:balance}
.hero .kick{font-family:var(--label);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:14px;color:var(--gualda);margin-bottom:8px}
.urn{flex:none;width:92px;height:auto}
.hero .body{padding:22px;display:flex;flex-direction:column;gap:18px}
.hero .body p{margin:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{all:unset;cursor:pointer;box-sizing:border-box;font-family:var(--label);font-weight:700;font-size:20px;letter-spacing:.06em;padding:6px 16px;border:2px solid var(--ink);background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lab{font-family:var(--label);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.cast{display:flex;gap:14px;flex-wrap:wrap}
.cast .badge{width:34px;height:34px}
/* resultado */
.res{padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.res h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.hemi{width:100%;max-width:420px;margin:0 auto;display:block}
.hemi .on{fill:var(--gualda);stroke:var(--ink);stroke-width:1.5} .hemi .off{fill:none;stroke:var(--line);stroke-width:1.5}
.big{font-family:var(--display);font-size:54px;line-height:1;text-align:center;margin-top:-6px;font-variant-numeric:tabular-nums}
.big span{font-size:24px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:34px 64px 1fr 44px;align-items:center;gap:10px;font-family:var(--label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.row .badge{width:30px;height:30px}
.row .t{height:12px;background:var(--line)} .row .t i{display:block;height:100%;background:var(--rojo)}
.row span:last-child{text-align:right;color:var(--muted)}
.rev{display:flex;flex-direction:column;gap:8px}
.rev div{border-left:4px solid var(--rojo);padding:4px 0 4px 12px;font-size:15px}
.rev b{font-weight:600}
.note{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.opt,.btn{transition:none}}
.inp{all:unset;box-sizing:border-box;width:100%;border:2px solid var(--ink);background:var(--paper);padding:12px 14px;font:600 20px var(--body);color:var(--ink)}
.inp:focus-visible{outline:3px solid var(--rojo);outline-offset:2px}
a.btn{display:inline-block;text-decoration:none}
.rank{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:32px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-family:var(--label);font-weight:700;font-size:20px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.rk span:first-child{color:var(--rojo)} .rk span:nth-child(2){overflow-wrap:anywhere}

.hero .band>div{min-width:0}
.hero .body p{overflow-wrap:anywhere}
.btns .btn{text-align:center}
@media (max-width:480px){
  .hero .band{padding:18px 16px;gap:12px}
  .urn{width:58px}
  .hero h1{font-size:clamp(24px,8.2vw,34px);overflow-wrap:anywhere}
  .hero .kick{font-size:12px;letter-spacing:.14em}
  .hero .body{padding:18px 16px}
  .card.ballot{padding:28px 16px 18px}
  .stamp{font-size:15px;border-width:3px;right:10px;bottom:20px;padding:1px 8px}
  .btn{font-size:17px;padding:10px 16px}
  .btns{flex-direction:column}
  .btns .btn{width:100%}
  .res{padding:20px 16px}
  .row{grid-template-columns:30px 66px 1fr 40px;gap:8px;font-size:16px}
  .brand{font-size:13px}
  .opt{font-size:20px}
}
</style>
</head>
<body>

<div class="flag"></div>
<div class="page"><div class="wrap">
  <div class="top">
    <div class="brand"><i></i>Generales 2023</div>
    <div class="stats" id="hud" hidden><span>Aciertos <b id="sc">0</b></span><span>Racha <b id="st">0</b></span></div>
  </div>
  <div class="pips" id="pips" hidden></div>
  <main id="app"></main>
</div></div>
<div class="flag"></div>

<script>
var REPO="TU_USUARIO/TU_REPO";
var BRANCH="main";
var NAME="";
var P=["VOX","PP","PSOE","Sumar"];
var SHAPES=[
 '<circle class="sh" cx="20" cy="20" r="19"/>',
 '<rect class="sh" x="2" y="2" width="36" height="36" rx="3"/>',
 '<polygon class="sh" points="20,1 38,12 38,28 20,39 2,28 2,12"/>',
 '<polygon class="sh" points="20,1 39,20 20,39 1,20"/>'];
var MONO=["V","PP","PS","S"];
function badge(k){return '<span class="badge"><svg viewBox="0 0 40 40" aria-hidden="true">'+SHAPES[k]+'<text x="20" y="25.5" text-anchor="middle">'+MONO[k]+'</text></svg></span>'}
var URN='<svg class="urn" viewBox="0 0 92 100" aria-hidden="true"><path d="M30 6h32v26H30z" fill="#fffdf6" stroke="#1b1410" stroke-width="3" transform="rotate(-8 46 19)"/>'+
 '<path d="M8 40h76v54H8z" fill="#f1bf00" stroke="#1b1410" stroke-width="3"/><rect x="26" y="36" width="40" height="8" fill="#1b1410"/>'+
 '<rect x="8" y="40" width="76" height="8" fill="#1b1410"/><rect x="24" y="43" width="44" height="3" fill="#aa151b"/>'+
 '<path d="M30 66l10 10 20-20" fill="none" stroke="#1b1410" stroke-width="7" stroke-linecap="square"/></svg>';
var Q=[
["Impuestos","Tipo único del 15% en el IRPF hasta 70.000 € y del 25% por encima.",0],
["Impuestos","Impuesto permanente a las grandes fortunas de al menos el 4%.",3],
["Impuestos","Bajada temporal del IVA de la carne, el pescado y las conservas.",1],
["Impuestos","Un Pacto contra el Fraude fiscal.",2],
["Impuestos","IRPF de hasta el 52% a partir de 300.000 € de renta.",3],
["Déficit","Presupuestos de base cero para eliminar déficit y deuda.",0],
["Déficit","Rechazar los límites del 3% de déficit y el 60% de deuda.",3],
["Déficit","Spending review y equilibrio de la Seguridad Social.",2],
["Déficit","Revisar las cuentas con la IGAE y reforzar la AIReF.",1],
["Empleo","Jornada máxima de 37,5 horas en 2024 y 32 después, sin bajar salarios.",3],
["Empleo","Bonificar el 100% de las cotizaciones el primer año a indefinidos de trabajadores españoles.",0],
["Empleo","Tarifa 0 para los nuevos autónomos.",1],
["Empleo","Salario mínimo igual al 60% del salario medio.",2],
["Pensiones","Pensiones contributivas exentas de IRPF.",0],
["Pensiones","Cuentas individuales portables.",1],
["Pensiones","Subir las mínimas y las no contributivas hasta el umbral de pobreza.",3],
["Vivienda","Derogar la Ley de Vivienda y poner IVA cero a la primera vivienda.",0],
["Vivienda","Avales para menores de 35 años de hasta el 95% de la hipoteca.",1],
["Vivienda","Plan de Alquiler Asequible con 50.000 viviendas de la Sareb.",2],
["Vivienda","1% del PIB durante diez años para más de 2 millones de viviendas protegidas.",3],
["Sanidad","Eliminar el copago farmacéutico.",2],
["Sanidad","Plan de choque en Atención Primaria con 1.000 plazas más de medicina de familia.",1],
["Sanidad","Devolver las competencias sanitarias al Estado, con tarjeta e historia clínica únicas.",0],
["Educación","Convertir la escuela concertada en subsidiaria de la pública.",3],
["Educación","Cheque escolar para elegir centro.",0],
["Inmigración","Bloqueo naval y expulsión inmediata de quien entre de forma ilegal.",0],
["Inmigración","Cierre de los CIE.",3],
["Inmigración","Aplicar el Pacto Europeo de Migración y Asilo y reforzar Frontex.",1],
["Inmigración","Reformar el arraigo y aprobar una ley de nacionalidad.",2],
["Territorio","Suprimir las policías autonómicas.",0],
["Territorio","Recuperar los delitos de sedición y malversación anteriores a la reforma de 2022.",1],
["Territorio","Definir España como plurinacional y mantener una mesa de diálogo con la Generalitat.",3],
["Territorio","Nueva financiación autonómica en un año, dentro de la Constitución.",2],
["Energía","Salir del Acuerdo de París.",0],
["Energía","90% de electricidad renovable en 2030 y moratoria a nuevas nucleares.",3],
["Energía","Apostar por los mini-reactores nucleares (SMR).",0],
["Energía","Revisar «siempre al alza» los compromisos climáticos europeos.",2],
["Exterior","Gastar el 2% del PIB en defensa y llegar a 140.000 efectivos.",1],
["Exterior","Desplazar progresivamente las garantías de la OTAN hacia una autonomía europea.",3],
["Exterior","Exigir que la OTAN proteja Ceuta y Melilla.",0],
["Exterior","Impulsar una Europa de la defensa a través de PESCO.",2],
["Derechos","Derogar la Ley de Violencia de Género y suprimir el Ministerio de Igualdad.",0],
["Derechos","Exigir el consentimiento paterno para el aborto de menores.",1],
["Derechos","Abolir la prostitución y oponerse a la gestación subrogada.",2],
["Derechos","Recuperar los juzgados de violencia de género.",3],
["Justicia","Integrar el Tribunal Constitucional en el Tribunal Supremo.",0],
["Justicia","Mandato de cinco años para el fiscal general.",1],
["Justicia","Crear una Agencia Anticorrupción.",2],
["Justicia","Aprobar una nueva ley de indultos y un CGPJ con protagonismo parlamentario y paridad.",3]
];
var app=document.getElementById("app"),S={},N=15;
function $(i){return document.getElementById(i)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function best(n,v){try{if(v!=null){var b=+localStorage.getItem("ap"+n)||0;if(v>b)localStorage.setItem("ap"+n,v);return Math.max(b,v)}return +localStorage.getItem("ap"+n)||0}catch(e){return v||0}}

function intro(){
  S={intro:true};$("hud").hidden=true;$("pips").hidden=true;
  var b=best(N);
  app.innerHTML='<section class="card hero"><div class="band">'+URN+'<div><div class="kick">Programas electorales</div><h1>Adivina el programa</h1></div></div>'+
   '<div class="body"><p><b>Camarada '+esc(NAME)+'.</b> Te leo una propuesta de los programas de 2023. Tú marcas de qué partido es.</p>'+
   '<div><div class="lab" style="margin-bottom:8px">Los cuatro programas</div><div class="cast">'+P.map(function(p,k){return '<span style="display:flex;align-items:center;gap:8px;font-family:var(--label);font-weight:700;font-size:18px;text-transform:uppercase">'+badge(k)+p+'</span>'}).join("")+'</div></div>'+
   (b?'<div class="lab">Tu mejor marca: '+b+' aciertos</div>':'')+
   '<div class="btns"><button class="btn" id="go" type="button">Empezar</button></div></div></section>';
  $("go").onclick=start;$("go").focus();
}
function start(){
  S={qs:shuffle(Q).slice(0,N),i:0,ok:0,streak:0,best:0,log:[],ans:null,by:[0,1,2,3].map(function(){return[0,0]})};
  $("hud").hidden=false;$("pips").hidden=false;render();
}
function hud(){
  $("sc").textContent=S.ok;$("st").textContent=S.streak;
  $("pips").innerHTML=S.qs.map(function(q,k){var l=S.log[k];return '<i class="'+(l?(l.good?"ok":"no"):(k===S.i?"cur":""))+'"></i>'}).join("");
}
function render(){
  if(S.i>=N)return results();
  hud();var q=S.qs[S.i];S.ans=null;
  app.innerHTML='<section class="card ballot"><div class="tag">'+q[0]+'<span>'+(S.i+1)+' / '+N+'</span></div>'+
   '<h2 class="q"><small>¿De qué programa es esta propuesta?</small>'+q[1]+'</h2>'+
   '<div class="opts" role="group" aria-label="Partidos">'+P.map(function(p,k){return '<button class="opt" data-k="'+k+'" type="button">'+badge(k)+p+'<kbd>'+(k+1)+'</kbd></button>'}).join("")+
   '</div><div id="fb" aria-live="polite"></div></section>';
  app.querySelectorAll(".opt").forEach(function(o){o.onclick=function(){answer(+o.dataset.k)}});
}
function answer(k){
  if(S.ans!=null)return;
  S.ans=k;var q=S.qs[S.i],c=q[2],good=k===c;
  S.by[c][1]++;if(good){S.by[c][0]++;S.ok++;S.streak++;if(S.streak>S.best)S.best=S.streak}else S.streak=0;
  S.log.push({q:q,k:k,good:good});
  app.querySelectorAll(".opt").forEach(function(o){var j=+o.dataset.k;o.setAttribute("aria-disabled","true");
    o.classList.add(j===c?"right":j===k?"wrong":"dim")});
  var last=S.i===N-1;
  var card=app.querySelector(".card");card.insertAdjacentHTML("beforeend",'<div class="stamp '+(good?"ok":"no")+'">'+(good?"ACIERTO":"FALLO")+'</div>');
  $("fb").innerHTML='<div class="fb"><p>'+(good?"<b>Correcto.</b> ":"<b>No era "+P[k]+".</b> ")+'Esa propuesta es del programa de <b>'+P[c]+'</b>.</p>'+
    '<button class="btn" id="nx" type="button">'+(last?"Ver resultado":"Siguiente")+'</button></div>';
  var nx=$("nx");nx.onclick=function(){S.i++;render()};nx.focus();hud();
}
function hemi(){
  var W=240,R=104,cx=120,cy=116,n=N,sp=Math.PI*R/(n-1),r=Math.min(10,sp*.38),out="";
  for(var i=0;i<n;i++){var a=Math.PI-i*Math.PI/(n-1),x=cx+R*Math.cos(a),y=cy-R*Math.sin(a);
    out+='<circle class="'+(i<S.ok?"on":"off")+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+'"/>'}
  return '<svg class="hemi" viewBox="0 0 240 130" role="img" aria-label="'+S.ok+' aciertos de '+N+'">'+out+'</svg>';
}
function results(){
  hud();var b=best(N,S.ok),r=S.ok/N;
  var m=r>=.85?"Tienes los programas en la cabeza.":r>=.6?"Buen nivel. Sabes leer entre líneas.":r>=.35?"Muchas propuestas se parecen. Hay margen.":"Los programas te han sorprendido. Otra ronda.";
  var fails=S.log.filter(function(l){return!l.good});
  var sendBtn="";
  if(REPO.indexOf("TU_")!==0){
    var pay={v:1,name:NAME,n:N,score:S.ok,streak:S.best,a:S.log.map(function(l){return[Q.indexOf(l.q),l.k]})};
    var url="https://github.com/"+REPO+"/issues/new?title="+encodeURIComponent("[resultado] "+NAME+" "+S.ok+"/"+N)+"&body="+encodeURIComponent("```json\n"+JSON.stringify(pay)+"\n```\n\nPulsa «Submit new issue» para enviar tu resultado a la clasificación.");
    sendBtn='<a class="btn" href="'+url+'" target="_blank" rel="noopener">Enviar a la clasificación</a>';
  }
  app.innerHTML='<section class="card res"><h2>'+m+'</h2>'+hemi()+'<div class="big">'+S.ok+'<span> / '+N+'</span></div>'+
   '<p style="margin:0;text-align:center" class="lab">Mejor racha '+S.best+' · Tu mejor marca: '+b+'</p>'+
   '<div class="rows">'+P.map(function(p,k){var a=S.by[k],w=a[1]?a[0]/a[1]*100:0;return '<div class="row">'+badge(k)+'<span>'+p+'</span><span class="t"><i style="width:'+w+'%"></i></span><span>'+(a[1]?a[0]+"/"+a[1]:"–")+'</span></div>'}).join("")+'</div>'+
   (fails.length?'<div><div class="lab" style="margin-bottom:8px">Para repasar</div><div class="rev">'+fails.map(function(l){return '<div>'+l.q[1]+' <b>→ '+P[l.q[2]]+'</b> (marcaste '+P[l.k]+')</div>'}).join("")+'</div></div>':"")+
   '<div class="btns">'+sendBtn+'<button class="btn" id="again" type="button">Otra ronda</button><button class="btn alt" id="cp" type="button">Copiar resultado</button></div></section>';
  $("again").onclick=start;$("again").focus();
  $("cp").onclick=function(){var t="Adivina el programa: "+S.ok+"/"+N+" (racha "+S.best+")";var el=$("cp");
    try{navigator.clipboard.writeText(t).then(function(){el.textContent="Copiado"},function(){el.textContent=t})}catch(e){el.textContent=t}};
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function gate(){
  S={intro:true};$("hud").hidden=true;$("pips").hidden=true;
  app.innerHTML='<section class="card hero"><div class="band">'+URN+'<div><div class="kick">Antes de votar</div><h1>¡Identifícate, camarada!</h1></div></div>'+
   '<form class="body" id="gf"><label class="lab" for="who">Tu nombre, apodo o lo que quieras</label>'+
   '<input id="who" class="inp" type="text" maxlength="24" autocomplete="nickname" placeholder="Camarada Anónimo" value="'+esc(NAME)+'">'+
   '<div class="btns"><button class="btn" type="submit">Entrar</button></div></form></section>';
  $("gf").onsubmit=function(e){e.preventDefault();NAME=$("who").value.trim().replace(/\s+/g," ")||"Anónimo";
    try{localStorage.setItem("apname",NAME)}catch(x){}intro()};
  $("who").focus();
}
document.addEventListener("keydown",function(e){
  if(S.intro||S.ans===undefined||S.i>=N)return;
  if(e.key>="1"&&e.key<="4"&&S.ans==null)answer(+e.key-1);
});
try{NAME=localStorage.getItem("apname")||""}catch(e){}
gate();
</script>
